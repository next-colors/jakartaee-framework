version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 * * *
      timezone: Asia/Tokyo
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
      gradle:
        patterns:
          - gradle/actions/*

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 * * *
      timezone: Asia/Tokyo
    groups:
      dokka:
        patterns:
          - org.jetbrains.dokka*
      junit:
        patterns:
          - org.junit.*
    ignore:
      # uroboroSQL 1.0.12 cannot evaluate /*IF ...*/ conditions that refer to
      # parameters with OGNL 3.4 or later.
      - dependency-name: ognl:ognl
        versions:
          - ">= 3.4"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 * * *
      timezone: Asia/Tokyo
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"
